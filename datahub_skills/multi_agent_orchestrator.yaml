# =========================================================
# DataHub Skill: Multi-Agent Orchestrator
# =========================================================
# Coordinator for the AI Data Reliability agent team.
# =========================================================

name: multi_agent_orchestrator
version: "1.0.0"
description: |
  Coordinates a five-agent team that investigates PostgreSQL schema drift
  end-to-end: Detector → RootCauseAnalyst → (ImpactAssessor ‖ FixAuthor)
  → Reviewer → (loop back to FixAuthor on REJECT) → DataHub write-back.
  Streams timeline events for a live UI. DataHub write-back only fires on
  reviewer APPROVE — the safety gate is enforced at the orchestrator level,
  not by convention.

author: AI Data Reliability Agent Team
license: Apache-2.0

tags: [multi-agent, orchestration, ml-ops, data-reliability]

inputs:
  max_review_iterations:
    type: integer
    default: 2
    description: "How many times FixAuthor may revise a rejected fix before it's held for human review."

outputs:
  session:
    type: object
    description: "Full InvestigationSession snapshot with every agent's findings."
  events:
    type: array
    description: "Timeline of AgentEvents (agent_start, tool_call, agent_message, review_verdict, ...)"

agents_orchestrated:
  - detector_agent
  - root_cause_analyst
  - impact_assessor
  - fix_author
  - reviewer_agent

llm_policy: |
  Pure-LLM design: every agent's analysis and the Reviewer's final verdict are
  genuine LLM output. Requires OPENAI_API_KEY (OPENAI_BASE_URL supported for
  OpenAI-compatible gateways) or ANTHROPIC_API_KEY — without a key the
  orchestrator refuses to start. Tools (schema scans, lineage reads, SQL
  validation) execute in code; the LLM reasons over that real output and can
  never fabricate it. A static safety validator guarantees the LLM Reviewer
  can never approve a script flagged as unsafe (LLM may be stricter, never
  more lenient).

datahub_integration:
  reads:
    - via: root_cause_analyst, impact_assessor
  writes:
    - aspect: globalTags
      condition: reviewer.verdict == APPROVE
    - aspect: datasetProperties
      condition: reviewer.verdict == APPROVE

execution:
  entrypoint: "src/agent/multi_agent/orchestrator.py"
  class: MultiAgentOrchestrator
  method: stream
  runtime: python3.10+
  framework: langgraph  # StateGraph with fan-out, join, and review-loop edges

  dependencies:
    - psycopg2-binary>=2.9.0
    - acryl-datahub>=0.14.0
    - langgraph>=0.2.0
    - langchain-core>=0.3.0
    # LLM providers — either OPENAI_API_KEY or ANTHROPIC_API_KEY is sufficient.
    - openai>=1.40.0            # optional
    - langchain-openai>=0.2.0   # optional
    - anthropic>=0.34.0         # optional
    - langchain-anthropic>=0.2.0 # optional

contribution_notes: |
  This orchestrator is the "team lead" pattern applied to DataHub agents:
  each specialist agent has a narrow tool set (separation of concern), the
  Reviewer can veto a fix and force a revision, and every write-back to
  DataHub is gated on the safety verdict.

  Proposed follow-up DataHub RFCs:
  - Native "agent team" entity type that groups related skills and captures
    the handoff graph in metadata.
  - Reviewer verdict aspect so downstream systems can see which fixes
    were approved by an automated safety gate before being applied.
